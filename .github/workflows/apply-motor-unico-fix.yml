name: Apply motor unico + fixes
on:
  push:
    paths:
      - '.github/motor-unico-trigger.txt'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact motor.js and apply index fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,re
          ROOT=Path('.')
          s=''.join(p.read_text().strip() for p in sorted(Path('.github/motor_gz').glob('part*.b64')))
          raw=gzip.decompress(base64.b64decode(s,validate=True))
          sha=hashlib.sha256(raw).hexdigest()
          expected='84a2959816de9a5f084ff13f133db59c4b9fada03b4f7991f792019dcc26de08'
          if sha!=expected: raise SystemExit(f'motor.js hash mismatch: {sha}')
          Path('motor.js').write_bytes(raw)
          code=Path('.github/scripts/apply_motor_unico_fix.py').read_text(encoding='utf-8')
          tail=code[code.index("p=ROOT/'index.html'"):]
          exec(tail)
          print('OK exact motor.js',sha)
          PY
      - name: Check motor.js syntax
        run: node --check motor.js
      - name: Commit functional changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motor.js index.html
          git diff --cached --quiet || git commit -m "Use single motor.js and apply UI fixes [skip ci]"
          git push

name: Export DietaPlanner v31 index
on:
  push:
    paths:
      - '.github/export_v31_trigger'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: dietaplanner-v31-index
          path: index.html
          if-no-files-found: error

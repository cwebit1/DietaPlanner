name: Validate DietaPlanner motor v10
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/apply_v33_hard_components.py'
      - '.github/scripts/test_set_matrix.py'
      - '.github/workflows/motor-v10-validation.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply granular HARD semantics
        run: python .github/scripts/apply_v33_hard_components.py
      - name: JavaScript syntax checks
        run: |
          node --check motor-v9-1.js
          node --check motor-v9-2.js
          node --check motor-v9-3.js
          node --check motor-v9-4.js
          node --check motor-v10.js
      - name: Run Set matrix and DB coverage scan
        run: python .github/scripts/test_set_matrix.py
      - name: Commit validated engine and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html motor-v10.js TEST-MATRICE-SET.md REVIEW-RICETTE-DB.md review-ricette-db.json
          git diff --cached --quiet || git commit -m "Validate granular HARD rules and record recipe DB gaps [skip ci]"
          git push

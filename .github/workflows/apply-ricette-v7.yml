name: Apply ricette v7 corrections

on:
  push:
    paths:
      - '.github/workflows/apply-ricette-v7.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch ricette.json
        shell: bash
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          p = Path('ricette.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['versione'] = 7
          by = {r['nome']: r for r in data['ricette']}

          halves = {
              'Risotto al radicchio e taleggio': ('Riso Arborio', 150, 75),
              'Pasta con speck e taleggio': ('Pasta corta', 150, 75),
              'Farro con emmental e verdure': ('Farro perlato', 125, 62.5),
              'Pasta alla provola e pomodoro': ('Pasta corta', 150, 75),
              'Riso con provola e zucchine': ('Riso Arborio', 150, 75),
              'Riso con branzino e zucchine': ('Riso Arborio', 150, 75),
              'Cous cous con sovracosce di pollo': ('Cous cous', 125, 62.5),
              'Pasta con pollo a dadini e zucchine': ('Pasta corta', 150, 75),
              'Riso con pollo a dadini e piselli': ('Riso Arborio', 150, 75),
          }
          for name, (ingname, old, new) in halves.items():
              r = by[name]
              for ing in r['ingredienti']:
                  if ing[0] == ingname and ing[1] == old:
                      ing[1] = new
                      break

          r = by['Pasta con speck e taleggio']
          for ing in r['ingredienti']:
              if ing[0] == 'Prosciutto crudo': ing[0] = 'Speck'
          r['procedimento'] = [s.replace('prosciutto crudo', 'speck') for s in r['procedimento']]

          r = by['Orecchiette con cime di rapa']
          for ing in r['ingredienti']:
              if ing[0] == 'Broccoli': ing[0] = 'Cime di rapa'
              elif ing[0] == 'Peperoni': ing[:] = ['Peperoncino', 2]

          r = by['Pasta con broccoli aglio e peperoncino']
          for ing in r['ingredienti']:
              if ing[0] == 'Peperoni': ing[:] = ['Peperoncino', 2]
          if not any(i[0] == 'Aglio' for i in r['ingredienti']):
              r['ingredienti'].append(['Aglio', 5])
          r['procedimento'] = [s.replace("Scalda l'olio con un pezzetto di peperoncino", "Scalda l'olio con uno spicchio d'aglio e un pezzetto di peperoncino") for s in r['procedimento']]

          r = by['Carote e finocchi in insalata']
          if not any(i[0] == 'Finocchi' for i in r['ingredienti']):
              r['ingredienti'].insert(1, ['Finocchi', 75])
          r['procedimento'] = [
              'Sbuccia le carote e tagliale a fiammifero sottile; affetta finemente i finocchi.',
              'Disponi carote e finocchi in una ciotola.',
              'Condisci con olio, sale e a piacere succo di limone.'
          ]

          r = by['Sgombro in scatola condito']
          for ing in r['ingredienti']:
              if ing[0] == 'Tonno in scatola': ing[0] = 'Sgombro in scatola'

          r = by['al limone e prezzemolo']
          for ing in r['ingredienti']:
              if ing[0] == 'Basilico fresco': ing[0] = 'Prezzemolo'

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          python -m json.tool ricette.json >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ricette.json
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Correct recipe data and portions [skip ci]'
          git push

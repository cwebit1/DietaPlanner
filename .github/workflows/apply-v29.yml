name: Apply DietaPlanner v29
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/apply_v29.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/apply_v29.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add colored dot headers to vegetable availability v29 [skip ci]"
          git push

name: Apply DietaPlanner v35
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/apply_v35.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply v35 functional unico composition
        run: python .github/scripts/apply_v35.py
      - name: Syntax check
        run: |
          node --check motor-v10.js
          python - <<'PY'
          import re, subprocess, pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          for i,code in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)):
              if not code.strip(): continue
              p=pathlib.Path(f'/tmp/inline_{i}.js');p.write_text(code,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Static invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('motor-v10.js').read_text(encoding='utf-8')
          checks=['motoreV10CompletaUnicoConPane','motoreV10ComponiUnicoDaDraft','fonte:\'composta_runtime\'','chiaveComposta','const composta=await motoreV10ComponiUnicoDaDraft']
          miss=[x for x in checks if x not in s]
          if miss: raise SystemExit('missing invariants: '+', '.join(miss))
          print('v35 invariants OK')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motor-v10.js index.html MOTORE-REGOLE.md REVIEW-RICETTE-DB.md
          git diff --cached --quiet || git commit -m "Compose functional unique dishes with carb fallback v35 [skip ci]"
          git push

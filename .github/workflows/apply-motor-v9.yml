name: Apply motor v9 loader

on:
  push:
    paths:
      - '.github/workflows/apply-motor-v9.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add v9 motor scripts to index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'motor-v9-1.js' not in s:
              loader='''\n<script src="motor-v9-1.js?v=9"></script>\n<script src="motor-v9-2.js?v=9"></script>\n<script src="motor-v9-3.js?v=9"></script>\n<script src="motor-v9-4.js?v=9"></script>\n'''
              s=s.replace('</body>', loader+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/apply-motor-v9.yml
          git commit -m 'Enable definitive Set-driven menu motor v9 [skip ci]'
          git push

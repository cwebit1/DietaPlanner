name: Apply DietaPlanner v11

on:
  push:
    paths:
      - '.github/workflows/apply-v11.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply v11 patch
        run: python .github/scripts/apply_v11.py
      - name: Validate JavaScript
        shell: bash
        run: |
          node --check motor-v9-1.js
          node --check motor-v9-2.js
          node --check motor-v9-3.js
          node --check motor-v9-4.js
          python - <<'PY'
          import re, pathlib, subprocess, tempfile, sys
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          for i,b in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)):
              if not b.strip(): continue
              p=pathlib.Path(tempfile.gettempdir())/f'inline_{i}.js'
              p.write_text(b,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr);sys.exit(r.returncode)
          PY
      - name: Commit v11
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html motor-v9-2.js motor-v9-4.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply meal editor v11 and enforce carb limits [skip ci]'
          git push

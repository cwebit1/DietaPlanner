name: Apply v17 settings patch
on:
  push:
    paths:
      - 'tools/apply_v17.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python tools/apply_v17.py
      - name: Commit result and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/apply_v17.py tools/v17_set_fragment.html tools/v17_carb_function.js tools/v17_veg_function.js tools/v17_engine_override.html .github/workflows/apply-v17.yml
          git add -A
          git commit -m "v17: riordina Setting e priorita verdure" || exit 0
          git push

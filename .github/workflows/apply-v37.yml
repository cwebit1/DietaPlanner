name: Apply DietaPlanner v37 and stress test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/apply_v37.py'
      - '.github/scripts/stress_v37.py'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply v37
        run: python .github/scripts/apply_v37.py
      - name: JavaScript syntax
        run: |
          node --check motor-v9-1.js
          node --check motor-v9-2.js
          node --check motor-v9-3.js
          node --check motor-v9-4.js
          node --check motor-v10.js
          python - <<'PY'
          import re,subprocess,pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          for i,code in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)):
              if not code.strip():continue
              p=pathlib.Path(f'/tmp/v37_{i}.js');p.write_text(code,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Stress v37
        run: python .github/scripts/stress_v37.py
      - name: Commit validated v37
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motor-v9-2.js motor-v9-3.js motor-v10.js index.html MOTORE-REGOLE.md STRESS-V37-REPORT.md
          git diff --cached --quiet || git commit -m "Validate quota-aware quick meals v37 [skip ci]"
          git push

name: Export complete project
on:
  push:
    paths:
      - '.github/export_complete_trigger.txt'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build operational archive and chunks
        run: |
          rm -rf .export_chunks DietaPlanner_COMPLETO.zip
          zip DietaPlanner_COMPLETO.zip \
            index.html ingredienti.json ricette.json manifest.json sw.js \
            icon-192.png icon-512.png \
            motor-v9-1.js motor-v9-2.js motor-v9-3.js motor-v9-4.js motor-v10.js \
            MOTORE-REGOLE.md REVIEW-RICETTE-DB.md TEST-MATRICE-SET.md
          mkdir .export_chunks
          base64 -w 0 DietaPlanner_COMPLETO.zip | split -b 8000 -d -a 3 - .export_chunks/chunk_
          printf '%s\n' "$(ls .export_chunks/chunk_* | wc -l)" > .export_chunks/count.txt
          sha256sum DietaPlanner_COMPLETO.zip > .export_chunks/sha256.txt
      - name: Commit complete archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f DietaPlanner_COMPLETO.zip .export_chunks
          git diff --cached --quiet || git commit -m "Export complete operational project [skip ci]"
          git push

name: Export complete project
on:
  push:
    paths:
      - '.github/export_complete_trigger.txt'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build complete archive and chunks
        run: |
          rm -rf .export_chunks DietaPlanner_COMPLETO.zip
          zip -r DietaPlanner_COMPLETO.zip . -x '.git/*' '.export_chunks/*' 'DietaPlanner_COMPLETO.zip'
          mkdir .export_chunks
          base64 -w 0 DietaPlanner_COMPLETO.zip | split -b 20000 -d -a 3 - .export_chunks/chunk_
          printf '%s\n' "$(ls .export_chunks/chunk_* | wc -l)" > .export_chunks/count.txt
          sha256sum DietaPlanner_COMPLETO.zip > .export_chunks/sha256.txt
      - name: Commit export chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .export_chunks
          git diff --cached --quiet || git commit -m "Export complete project chunks [skip ci]"
          git push

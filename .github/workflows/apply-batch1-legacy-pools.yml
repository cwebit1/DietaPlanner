name: Apply Batch 1 legacy pools
on:
  push:
    paths:
      - '.github/workflows/apply-batch1-legacy-pools.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html exact functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """async function cercaComponentiModulari(sottoCategoria){
            const tutteRicette = await getAll('ricette');
            return tutteRicette.filter(r =>
              r.tipoPortata === TIPO_PORTATA_MODULARE &&
              r.sottoCategoriaModulare === sottoCategoria &&
              !r.esclusa
            );
          }

          /* Cerca i componenti modulari proteici compatibili con un
             gruppoProteico specifico (sottotipo fine). */
          async function cercaProteineModulari(gruppoProteico){
            const tutteRicette = await getAll('ricette');
            return tutteRicette.filter(r =>
              r.tipoPortata === TIPO_PORTATA_MODULARE &&
              r.sottoCategoriaModulare === 'proteina' &&
              r.gruppoProteico === gruppoProteico &&
              !r.esclusa
            );
          }"""
          new = """async function cercaComponentiModulari(sottoCategoria){
            const tutteRicette = await getAll('ricette');
            return tutteRicette.filter(r =>
              !r.esclusa && (
                (r.tipoPortata === TIPO_PORTATA_MODULARE && r.sottoCategoriaModulare === sottoCategoria) ||
                r.tipoPortata === sottoCategoria
              )
            );
          }

          /* Cerca i componenti modulari proteici compatibili con un
             gruppoProteico specifico (sottotipo fine). Include anche le ricette
             legacy tipoPortata:'secondo' con lo stesso gruppoProteico, allo stesso
             modo in cui già fa lo swap manuale Salvafrigo. */
          async function cercaProteineModulari(gruppoProteico){
            const tutteRicette = await getAll('ricette');
            return tutteRicette.filter(r =>
              !r.esclusa && r.gruppoProteico === gruppoProteico && (
                (r.tipoPortata === TIPO_PORTATA_MODULARE && r.sottoCategoriaModulare === 'proteina') ||
                r.tipoPortata === 'secondo'
              )
            );
          }"""
          if old not in s:
              raise SystemExit('BATCH1_ABORT: exact old block not found')
          if s.count(old) != 1:
              raise SystemExit(f'BATCH1_ABORT: old block occurs {s.count(old)} times')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify only index changed and exact new logic exists
        run: |
          git diff --name-only
          test "$(git diff --name-only | tr -d '\r')" = "index.html"
          grep -F "r.tipoPortata === sottoCategoria" index.html
          grep -F "r.tipoPortata === 'secondo'" index.html
      - name: Commit Batch 1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Batch 1: include legacy secondi and contorni in modular pools"
          git push

name: Apply DietaPlanner v33
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/apply_v33.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply layered engine integration
        run: python .github/scripts/apply_v33.py
      - name: Syntax check motor files
        run: |
          node --check motor-v9-1.js
          node --check motor-v9-2.js
          node --check motor-v9-3.js
          node --check motor-v9-4.js
          node --check motor-v10.js
      - name: Check inline JavaScript
        run: |
          python - <<'PY'
          import re, subprocess, pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          for i,code in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)):
              if not code.strip(): continue
              p=pathlib.Path(f'/tmp/inline_{i}.js')
              p.write_text(code,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html motor-v10.js
          git diff --cached --quiet || git commit -m "Enable layered menu engine v10 v33 [skip ci]"
          git push

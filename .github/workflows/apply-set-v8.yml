name: Apply Set-driven menu v8

on:
  push:
    paths:
      - '.github/workflows/apply-set-v8.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch_repo_v8.py
          python /tmp/patch_repo_v8.py
          python - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          blocks=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          open('/tmp/check.js','w',encoding='utf-8').write(blocks[0])
          PY
          node --check /tmp/check.js
          python -m json.tool ricette.json >/dev/null
          python -m json.tool ingredienti.json >/dev/null
      - name: Commit results
        shell: bash
        run: |
          rm -f .github/workflows/apply-set-v8.yml .github/workflows/apply-ricette-v7.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ricette.json ingredienti.json .github/workflows
          git commit -m 'Move menu planning to Set and complete ingredients [skip ci]'
          git push

name: Apply Batch 3A 3B
on:
  push:
    paths:
      - '.github/workflows/apply-batch3-ab.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact replacements
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('motor-v10.js')
          s = p.read_text()
          old_a = "if(!candidati.length) candidati=Object.keys(FREQUENZE_MOTORE_BIBBIA).filter(k=>conteggi[k]<FREQUENZE_MOTORE_BIBBIA[k].max && !limitate.has(k));\n      if(!candidati.length) candidati=Object.keys(FREQUENZE_MOTORE_BIBBIA).filter(k=>conteggi[k]<FREQUENZE_MOTORE_BIBBIA[k].max);"
          new_a = "if(!candidati.length) candidati=Object.keys(FREQUENZE_MOTORE_BIBBIA).filter(k=>conteggi[k]<FREQUENZE_MOTORE_BIBBIA[k].max && !limitate.has(k));"
          if old_a not in s:
              raise SystemExit('Batch 3A target not found exactly')
          s = s.replace(old_a, new_a, 1)
          old_b = "const alt=candidati.filter(k=>k!==prev); if(alt.length)candidati=alt;"
          new_b = "const alt=candidati.filter(k=>k!==prev);\n      if(alt.length) candidati=alt;\n      else stato.errori && stato.errori.push(`Proteina ripetuta nello stesso giorno (${g} — nessuna alternativa disponibile per ${prev})`);"
          if old_b not in s:
              raise SystemExit('Batch 3B target not found exactly')
          s = s.replace(old_b, new_b, 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motor-v10.js
          git diff --cached --quiet || git commit -m "Apply Batch 3A and 3B to motor v10"
          git push

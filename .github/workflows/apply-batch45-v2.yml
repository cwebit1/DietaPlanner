name: Apply Batch 45 v2
on:
  push:
    paths:
      - '.github/workflows/apply-batch45-v2.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/apply_batch45.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Apply Batch 4 and 5 recipe editor improvements"
          git push

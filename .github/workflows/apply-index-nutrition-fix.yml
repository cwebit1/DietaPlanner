name: Apply nutrition completeness fix

on:
  push:
    paths:
      - '.github/workflows/apply-index-nutrition-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""function calcolaNutrizioneDaIngredientiJson(ingredientiGrezzi){
            let kcal=0, prot=0, carb=0, grassi=0, trovatoAlmenoUno=false;
            for(const [nome, g] of (ingredientiGrezzi||[])){
              const dati = ingredientiJsonMap[nome];
              if(!dati) continue;
              trovatoAlmenoUno = true;
              const fattore = (g||0)/100;
              kcal += (dati.kcal||0)*fattore;
              prot += (dati.proteine||0)*fattore;
              carb += (dati.carboidrati||0)*fattore;
              grassi += (dati.grassi||0)*fattore;
            }
            return trovatoAlmenoUno ? {kcal,prot,carb,grassi} : null;
          }"""
          new="""function calcolaNutrizioneDaIngredientiJson(ingredientiGrezzi){
            let kcal=0, prot=0, carb=0, grassi=0, trovatoAlmenoUno=false;
            let ingredienteMancante=false;
            for(const [nome, g] of (ingredientiGrezzi||[])){
              const dati = ingredientiJsonMap[nome];
              if(!dati){
                ingredienteMancante=true;
                continue;
              }
              trovatoAlmenoUno = true;
              const fattore = (g||0)/100;
              kcal += (dati.kcal||0)*fattore;
              prot += (dati.proteine||0)*fattore;
              carb += (dati.carboidrati||0)*fattore;
              grassi += (dati.grassi||0)*fattore;
            }
            // Mai salvare come totale completo una nutrizione calcolata solo su parte
            // degli ingredienti: in quel caso il fallback resta il valore precedente/DB.
            return (trovatoAlmenoUno && !ingredienteMancante) ? {kcal,prot,carb,grassi} : null;
          }"""
          if old not in s: raise SystemExit('Blocco atteso non trovato')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Prevent partial nutrition totals [skip ci]'
          git push

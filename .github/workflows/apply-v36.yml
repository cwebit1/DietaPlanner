name: Apply DietaPlanner v36 and stress test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/apply_v36.py'
      - '.github/scripts/stress_v36.py'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply v36
        run: python .github/scripts/apply_v36.py
      - name: JavaScript syntax
        run: |
          node --check motor-v9-1.js
          node --check motor-v9-2.js
          node --check motor-v9-3.js
          node --check motor-v9-4.js
          node --check motor-v10.js
          python - <<'PY'
          import re,subprocess,pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          for i,code in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)):
              if not code.strip():continue
              p=pathlib.Path(f'/tmp/i{i}.js');p.write_text(code,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Stress matrix
        run: python .github/scripts/stress_v36.py
      - name: Commit validated engine and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motor-v10.js index.html MOTORE-REGOLE.md STRESS-V36-REPORT.md
          git diff --cached --quiet || git commit -m "Validate layered motor v36 [skip ci]"
          git push

<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#181c14"><title>DietaPlanner · Prova Pasto</title>
<style>
:root{--bg:#181c14;--panel:#20261a;--panel-2:#262d1e;--border:#374025;--accent:#9cc23a;--accent-dim:#4a5a2a;--warn:#d97757;--text:#eef0e6;--text-dim:#98a086;--radius:12px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}body{padding:75px 0 76px}button{font:inherit}.topbar{position:fixed;z-index:30;inset:0 0 auto;height:75px;padding:12px 15px 10px;border-bottom:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:1.5rem;font-weight:800;letter-spacing:-.04em}.brand span{color:var(--accent)}.tagline{margin-top:2px;color:var(--text-dim);font-size:.58rem;letter-spacing:.22em;text-transform:uppercase}.user{display:grid;grid-template-columns:auto 35px;align-items:center;gap:9px;text-align:right;font-size:.7rem;line-height:1.35;font-weight:650}.avatar{width:35px;height:35px;border:1px solid var(--border);border-radius:50%;display:grid;place-items:center;background:var(--panel-2);color:var(--accent)}.avatar svg{width:23px;height:23px;fill:currentColor}main{width:min(640px,100%);margin:auto;padding:0 12px 22px}.calendar-strip{height:56px;margin:0 -12px 11px;padding:0 7px;border-bottom:1px solid var(--border);background:var(--panel);display:grid;grid-template-columns:27px minmax(0,1fr) 27px;align-items:center}.calendar-arrow{height:100%;padding:0;border:0;background:none;color:var(--text);font-size:1.55rem}.days{display:flex;min-width:0;overflow:hidden;scroll-behavior:smooth}.day{flex:0 0 calc(100%/7);height:38px;padding:0;border:1px solid transparent;border-radius:18px;background:none;color:var(--text-dim);font-size:.69rem;white-space:nowrap}.day.today{border-color:var(--accent)}.day.active{background:var(--accent-dim);color:var(--accent);font-weight:800}.page-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;margin-bottom:10px}.page-head h1{font:700 1.55rem/1.05 Georgia,serif}.head-tools{display:flex;align-items:center;gap:7px}.calendar-icon{width:30px;height:30px;padding:0;border:0;background:none;color:var(--text)}.calendar-icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8}.copy-day{height:34px;padding:0 11px;border:1px solid var(--border);border-radius:18px;background:var(--panel-2);color:var(--text);font-size:.7rem;white-space:nowrap}.meals{display:grid;gap:11px}.meal{position:relative;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.2)}.meal-head{height:40px;padding:0 10px;display:grid;grid-template-columns:29px minmax(0,1fr) auto;align-items:center;background:var(--panel-2);color:var(--accent)}.meal-symbol{font-size:1.25rem}.meal-symbol.sun{color:#f1c40f}.meal-name{font-size:.92rem;font-weight:800;letter-spacing:.035em}.meal-time{color:var(--text-dim);font:700 .7rem Georgia,serif}.meal-frame{position:relative}.carousel{overflow:hidden;touch-action:pan-y}.track{display:flex;transform:translateX(-100%);will-change:transform}.slide{flex:0 0 100%;min-width:0}.photo-row{height:126px;display:grid;grid-template-columns:minmax(0,1fr) 15%;gap:8px;padding-left:9px;overflow:hidden}.photo-row img{width:100%;height:100%;object-fit:cover}.photo-main{border-radius:9px}.photo-peek{border-radius:9px 0 0 9px}.carousel-next{position:absolute;z-index:3;right:15px;top:46px;width:36px;height:36px;padding:0;border:1px solid var(--border);border-radius:50%;background:rgba(32,38,26,.94);color:var(--text);font-size:1.55rem;line-height:1;box-shadow:0 2px 7px rgba(0,0,0,.3)}.dots{height:16px;display:flex;align-items:center;justify-content:center;gap:7px}.dot{width:6px;height:6px;border-radius:50%;background:var(--border)}.dot.active{background:var(--accent)}.meal-copy{padding:0 10px 8px}.dish-row{display:grid;grid-template-columns:minmax(0,1fr) 38px 38px;gap:5px;align-items:center}.dish-title{margin:0;font:700 1rem/1.08 Georgia,serif;overflow-wrap:anywhere}.dish-kind{margin-right:4px;color:var(--accent);font:800 .55rem/1 sans-serif;letter-spacing:.08em;text-transform:uppercase}.round-action{width:38px;height:38px;padding:0;border:1px solid var(--border);border-radius:50%;background:var(--panel-2);display:grid;place-items:center}.favorite{color:#f1c40f}.favorite svg{width:25px;height:25px;fill:currentColor;stroke:#b98908}.favorite.active svg{animation:spin 2.8s linear infinite}.lock{color:var(--accent)}.lock svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}@keyframes spin{to{transform:rotate(360deg)}}.ingredients{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:5px 0 7px}.ingredient{display:grid;grid-template-columns:27px minmax(0,1fr);align-items:center;min-width:0}.food-icon{font-size:1.3rem;text-align:center}.ingredient-name{min-width:0;font-size:.68rem;line-height:1.12}.ingredient-name small{display:block;margin-top:2px;color:var(--text-dim);font-size:.62rem}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding-top:7px;border-top:1px solid var(--border)}.action{height:34px;padding:0 7px;border:1px solid var(--border);border-radius:9px;background:var(--panel-2);color:var(--text);font-size:.7rem;font-weight:750}.action.primary{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-color:var(--accent-dim);background:var(--accent-dim);color:var(--accent)}.action.primary .icon{justify-self:end;margin-right:7px;font-size:1rem}.action.primary .chev{justify-self:end;font-size:1.25rem}.action.choose{animation:red-fade 1.15s ease-in-out infinite}@keyframes red-fade{0%,100%{background:var(--panel-2);border-color:var(--border);color:var(--text)}50%{background:#8f2924;border-color:#d9584f;color:#fff}}.special-mode{border-color:#b48513}.special-mode .dots{visibility:hidden}.special-mode .meal-head{color:#f1c40f}.vertical-out{animation:out-down .28s linear both}.vertical-in{animation:in-down .28s linear both}@keyframes out-down{to{transform:translateY(100%)}}@keyframes in-down{from{transform:translateY(-100%)}to{transform:translateY(0)}}.bottom{position:fixed;z-index:30;inset:auto 0 0;height:76px;padding:5px 4px calc(5px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--panel);display:grid;grid-template-columns:repeat(6,1fr)}.nav{padding:3px 1px;border:0;border-radius:9px;background:none;color:var(--text-dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.56rem}.nav svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.nav.active{background:var(--accent-dim);color:var(--accent);font-weight:800}@media(min-width:500px){.topbar{height:84px}.brand{font-size:1.9rem}.photo-row{height:165px}.carousel-next{top:64px}.dish-title{font-size:1.2rem}}
</style></head><body>
<header class="topbar"><div><div class="brand">Dieta<span>Planner</span></div><div class="tagline">Piani sani, giorni migliori</div></div><div class="user"><span>Ciao Cwe,<br>Buon Appetito!</span><span class="avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0Z"/></svg></span></div></header>
<main><nav class="calendar-strip"><button class="calendar-arrow" data-days="-1">‹</button><div class="days"><button class="day">Ven 4</button><button class="day">Sab 5</button><button class="day">Dom 6</button><button class="day active today">Lun 7</button><button class="day">Mar 8</button><button class="day">Mer 9</button><button class="day">Gio 10</button></div><button class="calendar-arrow" data-days="1">›</button></nav><section class="page-head"><h1>Lunedì 7 Settembre</h1><div class="head-tools"><button class="calendar-icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg></button><button class="copy-day">▣&nbsp; Copia giorno</button></div></section><section class="meals" id="meals"></section></main>
<nav class="bottom"><button class="nav active">🍴<span>Pasto</span></button><button class="nav">▣<span>Menù</span></button><button class="nav">▤<span>Ricette</span></button><button class="nav">🛒<span>Spesa</span></button><button class="nav">◇<span>Inventario</span></button><button class="nav">⚙<span>Set</span></button></nav>
<script>
const A='assets/visual-demo/';const meals=[{name:'COLAZIONE',symbol:'☀',sun:1,time:'07:00 – 09:00',items:[{kind:'Colazione',title:'Overnight oats con frutti di bosco',img:'colazione-overnight-oats.webp',ingredients:[['🌾','Avena','60 g'],['🥛','Yogurt greco','150 g'],['🫐','Frutti di bosco','100 g']]},{kind:'Colazione',title:'Colazione alternativa',img:'alternativa-farro-pomodorini-zucchine.webp',ingredients:[['🌾','Cereali','60 g'],['🥛','Yogurt','125 g'],['🍓','Frutta','100 g']]}]},{name:'PRANZO',symbol:'☀',sun:1,time:'12:30 – 14:30',items:[{kind:'Primo',title:'Spaghetti integrali alle vongole',img:'pranzo-spaghetti-vongole.webp',ingredients:[['🌾','Spaghetti integrali','80 g'],['🐚','Vongole','150 g'],['🌿','Prezzemolo','q.b.']]},{kind:'Primo',title:'Farro con pomodorini e zucchine',img:'alternativa-farro-pomodorini-zucchine.webp',ingredients:[['🌾','Farro','80 g'],['🍅','Pomodorini','100 g'],['🥒','Zucchine','100 g']]},{kind:'Secondo',title:'Branzino ai ferri',img:'alternativa-branzino-ferri.webp',ingredients:[['🐟','Branzino','150 g'],['🍋','Limone','q.b.'],['🌿','Erbe','q.b.']]}]},{name:'CENA',symbol:'☾',time:'19:30 – 21:30',items:[{kind:'Secondo',title:'Ceci al rosmarino con radicchio variegato',img:'cena-ceci-radicchio.webp',ingredients:[['🫘','Ceci','150 g'],['🌿','Rosmarino','q.b.'],['🥬','Radicchio','100 g']]},{kind:'Contorno',title:'Insalata di carote e barbabietole',img:'alternativa-insalata-carote-barbabietole.webp',ingredients:[['🥕','Carote','100 g'],['🟣','Barbabietole','100 g'],['🫒','Olio EVO','5 g']]}]}];
const specials=[{kind:'Speciale',title:'Pizza alle verdure grigliate',img:'speciale-pizza-verdure.webp',ingredients:[['🍞','Impasto','1 porzione'],['🥒','Verdure','180 g'],['🍅','Pomodoro','80 g']]},{kind:'Speciale',title:'Torta salata con verdure',img:'speciale-torta-salata-verdure.webp',ingredients:[['🥧','Pasta brisée','1 porzione'],['🥒','Zucchine','100 g'],['🥬','Spinaci','80 g']]},{kind:'Speciale',title:'Sushi misto',img:'speciale-sushi-misto.webp',ingredients:[['🍚','Riso','100 g'],['🐟','Pesce misto','150 g'],['🥒','Cetriolo','50 g']]}];
const lock='<svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 7.7-1.5"/><circle cx="12" cy="15.5" r="1"/></svg>',star='<svg viewBox="0 0 24 24"><path d="m12 2.8 2.8 5.7 6.3.9-4.5 4.4 1 6.2-5.6-3-5.6 3 1-6.2-4.5-4.4 6.3-.9Z"/></svg>';
function body(x,s){return `<div class="meal-copy"><div class="dish-row"><h2 class="dish-title"><span class="dish-kind">${x.kind}</span>${x.title}</h2><button class="round-action favorite${s?' active':''}">${star}</button><button class="round-action lock">${lock}</button></div><div class="ingredients">${x.ingredients.map(v=>`<div class="ingredient"><span class="food-icon">${v[0]}</span><span class="ingredient-name">${v[1]}<small>${v[2]}</small></span></div>`).join('')}</div><div class="actions"><button class="action${s?' choose':''}" data-change>${s?'✓ Seleziona pasto':'⟳ Cambia piatto'}</button><button class="action primary"><span class="icon">☷</span><span>Dettagli</span><span class="chev">›</span></button></div></div>`}
function make(d,n){let e=document.createElement('article');e.className='meal';e._normal=d.items;e._special=false;e._index=0;e.innerHTML=`<header class="meal-head"><span class="meal-symbol${d.sun?' sun':''}">${d.symbol}</span><span class="meal-name">${d.name}</span><span class="meal-time">${d.time}</span></header><div class="meal-frame"><div class="carousel"><div class="track"></div></div><button class="carousel-next">›</button></div>`;render(e);return e}
function render(e){let a=e._special?specials:e._normal,i=(e._index+a.length)%a.length;e._index=i;let prev=a[(i-1+a.length)%a.length],cur=a[i],next=a[(i+1)%a.length];e.classList.toggle('special-mode',e._special);e.querySelector('.track').innerHTML=[prev,cur,next].map((x,n)=>`<section class="slide"><div class="photo-row"><img class="photo-main" src="${A+x.img}" alt="${x.title}"><img class="photo-peek" src="${A+a[(i+n)%a.length].img}" alt=""></div>${n===1?body(x,e._special):''}</section>`).join('');e.querySelector('.track').style.transform='translateX(-100%)';bind(e)}
function bind(e){e.querySelector('.carousel-next').onclick=()=>move(e);e.querySelector('.favorite').onclick=()=>{e._special=!e._special;e._index=0;render(e)};e.querySelector('[data-change]').onclick=o=>{if(e._special){o.currentTarget.textContent='✓ Pasto selezionato';o.currentTarget.classList.remove('choose')}else vertical(e)}}function move(e){let t=e.querySelector('.track');t.style.transition='transform .28s linear';t.style.transform='translateX(-200%)';setTimeout(()=>{e._index++;render(e)},285)}function vertical(e){let f=e.querySelector('.meal-frame');f.classList.add('vertical-out');setTimeout(()=>{e._index++;render(e);f.classList.remove('vertical-out');f.classList.add('vertical-in');setTimeout(()=>f.classList.remove('vertical-in'),290)},280)}
document.querySelector('#meals').append(...meals.map(make));document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>document.querySelector('.days').scrollBy({left:Number(b.dataset.days)*90,behavior:'smooth'}));
</script></body></html>
